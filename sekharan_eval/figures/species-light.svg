<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Species Gemini named for the tortoise photos, by prompt</title><desc id="d">Texas tortoise: original prompt 152, neutral prompt 60; “Tortoise”: original prompt 5, neutral prompt 38; Desert tortoise: original prompt 3, neutral prompt 26; Gopher tortoise: original prompt 2, neutral prompt 22; Red-footed tortoise: original prompt 0, neutral prompt 7; Other tortoise species: original prompt 0, neutral prompt 9; Box turtle: original prompt 2, neutral prompt 2</desc>
<rect x="0.5" y="0.5" width="899" height="539" rx="12" fill="#fcfcfb" stroke="#0b0b0b" stroke-opacity="0.1"/>
<text x="32.0" y="44.0" font-size="19" font-weight="600" fill="#0b0b0b" text-anchor="start" >Without the hint, Gemini still finds every tortoise but often names the wrong one</text>
<text x="32.0" y="68.0" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" >What Gemini called the 164 tortoise photos, all of them Texas tortoises. Every answer below counts as found.</text>
