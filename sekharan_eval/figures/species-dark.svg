<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Species Gemini named for the tortoise photos, by prompt</title><desc id="d">Texas tortoise: original prompt 155, neutral prompt 57; “Tortoise”: original prompt 2, neutral prompt 39; Desert tortoise: original prompt 2, neutral prompt 26; Gopher tortoise: original prompt 2, neutral prompt 27; Red-footed tortoise: original prompt 1, neutral prompt 6; Other tortoise species: original prompt 1, neutral prompt 8; Box turtle: original prompt 2, neutral prompt 2</desc>
<rect x="0.5" y="0.5" width="899" height="539" rx="12" fill="#1a1a19" stroke="#ffffff" stroke-opacity="0.1"/>
<text x="32.0" y="44.0" font-size="19" font-weight="600" fill="#f0efec" text-anchor="start" >Without the hint, Gemini still finds every tortoise but often names the wrong one</text>
<text x="32.0" y="68.0" font-size="13.5" font-weight="400" fill="#c3c2b7" text-anchor="start" >What Gemini called the 165 tortoise photos, all of them Texas tortoises. Every answer below counts as found.</text>
